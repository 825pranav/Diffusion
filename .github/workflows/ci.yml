name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Two passes on purpose. llama-index-core 0.10.x declares numpy<2 while
        # scipy/lightgbm/pandas need numpy>=2; resolving both in one pass is
        # impossible and pip exits non-zero. Installed separately, the agent
        # goes in first and the main pin set then restores numpy, which the
        # agent runs on correctly despite its declared bound. pip warns about
        # the unsatisfied pin here and that warning is expected.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt
          pip install -r requirements.txt
          pip install "numpy>=2.1,<2.8"
          python -m spacy download en_core_web_sm

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite is pure — no Postgres, Kafka, or model server. Anything
        # needing those belongs in the e2e script, which runs against a live
        # stack rather than in CI.
        run: pytest
